# Pipeline de publicación: cada `git push` a main compila y publica en GitHub Pages.
#
# Pasos para el usuario (una sola vez):
#   1. Subir este repositorio a GitHub como repositorio PÚBLICO (Pages y Actions son gratis solo en públicos).
#   2. En el repo: Settings > Pages > Source > "GitHub Actions".
#   3. `base` en vite.config.ts debe coincidir con el NOMBRE del repositorio (por defecto: /plantapps/).

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No corta builds anteriores si hay uno en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y tests
        run: npm run verify

      - name: Compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4